name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          cache: maven
          distribution: zulu
          java-version: 17

      - name: Verify
        run: mvn --batch-mode --show-version verify

      # Coverage is useful but an external service outage must not invalidate a
      # successful Maven verification. The pinned action authenticates with OIDC.
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ./quickfixj-spring-boot-actuator/target/site/jacoco/jacoco.xml,./quickfixj-spring-boot-autoconfigure/target/site/jacoco/jacoco.xml,./quickfixj-spring-boot-context/target/site/jacoco/jacoco.xml
          use_oidc: true
