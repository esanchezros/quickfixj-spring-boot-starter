name: Feature request
description: Propose a compatible improvement or a new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user problem before describing a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: Describe the result that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional. Include alternatives if you have evaluated them.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auto-configuration
        - Configuration properties
        - Core lifecycle
        - Actuator and operations
        - Testing
        - Build and release
        - Documentation
        - Ecosystem integration
        - Other
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Expected compatibility impact
      options:
        - No public contract change
        - Backward-compatible addition
        - Deprecation
        - Behavior change
        - Breaking change
        - Unknown
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues, pull requests, and the roadmap.
          required: true
